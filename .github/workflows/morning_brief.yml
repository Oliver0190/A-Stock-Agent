name: Morning Brief

on:
  # Retired: collection is now owned by the local dual-market website.
  workflow_dispatch:

jobs:
  brief:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore state.json from cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: stock-agent-state-${{ github.run_id }}
          restore-keys: |
            stock-agent-state-
      - run: pip install -r requirements.txt
      - name: Run morning brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL_ASTOCK: ${{ secrets.FEISHU_WEBHOOK_URL_ASTOCK }}
          TZ: Asia/Shanghai
          DATA_SOURCE: akshare
        run: python -m src.jobs morning
